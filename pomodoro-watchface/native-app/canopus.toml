schema = 1

[module]
id = "org.pomodoro.band9pro"
version = "0.1.0"
language = "rust"
lifecycle = "resident-after-activation"
canopus_abi = "1"

# Canopus target ids.
#
# NOTE: Mi Band 9 Pro 3.1.175 is NOT a target the upstream Canopus framework
# ships. Its README lists Band 10 Pro 3.101.036, Band 10 Pro 3.101.043 and
# Band 11 4.100.139, and the framework selects a private ABI backend from
# targets/<target-id>.env, failing closed for an unknown id. This entry names
# the pack WE generate with tools/target_pack.py
# (see targets/xiaomi-band-9-pro-3.1.175.md), not an upstream one.
[targets]
include = [
  "xiaomi-band-9-pro-3.1.175",
]

[capabilities]
# The audio module needs a bluetooth stack; the pomodoro app needs identity,
# the native-app publication path, launcher persistence, UI dispatch, haptics,
# and the notification tray.
required = [
  "identity-guard",
  "native-app.register",
  "launcher.entry",
  "ui.dispatch",
  "vibrator",
  # Confirmed present on this firmware (lvx_notification_init_message /
  # lvx_notification_insert_message / lvx_notification_remove_message ...),
  # and unreachable from watchface Lua - so it is the whole point of going
  # native for "supports system notifications".
  "notifications.tray",
]
optional = [
  # Reminder-style notification (lvx_notification_start_reminder): available,
  # but its semantics should be validated on device before being required.
  "notifications.reminder",
]

[native_app]
enabled = true
app_id = "org.pomodoro.band9pro"
name = "番茄钟"
entry = "canopus_module_descriptor"
role = "standalone"
